plugins {
    id 'com.android.application'
}

android {
    namespace 'de.x3d.zonenfrei'
    compileSdk 35

    defaultConfig {
        applicationId "de.x3d.zonenfrei"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
